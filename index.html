<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quotecraft 2 — Tree Service Estimating & Quote Management</title>
<style>
:root {
  --bg: #f3f6f4;
  --surface: #ffffff;
  --surface-2: #f8faf9;
  --surface-3: #eef3f0;
  --ink: #16241d;
  --ink-2: #46554d;
  --muted: #748078;
  --line: #dce4df;
  --line-strong: #c8d4cc;
  --brand: #176b45;
  --brand-dark: #0e4d31;
  --brand-soft: #e1f2e9;
  --accent: #d99b35;
  --accent-soft: #fff3d9;
  --danger: #b43b3b;
  --danger-soft: #fdeaea;
  --warning: #9a6619;
  --warning-soft: #fff5df;
  --info: #356b91;
  --info-soft: #e7f1f8;
  --success: #23794d;
  --success-soft: #e5f5ec;
  --shadow: 0 8px 28px rgba(28, 57, 41, .08);
  --shadow-sm: 0 2px 8px rgba(28, 57, 41, .06);
  --radius: 14px;
  --radius-sm: 9px;
  --sidebar: 248px;
  --header: 70px;
  --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background: var(--bg);
  font-size: 14px;
  line-height: 1.5;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }
a { color: var(--brand); }
h1, h2, h3, h4, p { margin-top: 0; }
h1 { font-size: 26px; letter-spacing: -.5px; margin-bottom: 5px; }
h2 { font-size: 19px; letter-spacing: -.25px; margin-bottom: 14px; }
h3 { font-size: 15px; margin-bottom: 10px; }
small { font-size: 12px; }
.muted { color: var(--muted); }
.hidden { display: none !important; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
.app-shell { min-height: 100vh; }
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--sidebar);
  background: #10291e;
  color: #eaf3ed;
  padding: 21px 15px;
  display: flex;
  flex-direction: column;
  z-index: 30;
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 10px 22px;
}
.brand-mark {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: linear-gradient(145deg, #41b878, #197448);
  display: grid;
  place-items: center;
  color: white;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
  flex: 0 0 auto;
}
.brand-name { font-size: 17px; font-weight: 760; line-height: 1.2; }
.brand-sub { font-size: 10px; color: #9cb9a8; letter-spacing: 1.2px; text-transform: uppercase; }
.nav-label {
  color: #789987;
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 1.3px;
  text-transform: uppercase;
  padding: 12px 12px 7px;
}
.nav-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 11px;
  border: 0;
  background: transparent;
  color: #c5d8cc;
  border-radius: 9px;
  padding: 10px 12px;
  margin: 2px 0;
  text-align: left;
  font-weight: 560;
  transition: background .15s, color .15s;
}
.nav-item:hover { background: rgba(255,255,255,.07); color: white; }
.nav-item.active { background: #22543a; color: white; }
.nav-item svg { width: 18px; height: 18px; flex: 0 0 auto; }
.nav-count {
  margin-left: auto;
  font-size: 11px;
  background: rgba(255,255,255,.11);
  border-radius: 99px;
  padding: 1px 7px;
}
.sidebar-footer {
  margin-top: auto;
  border-top: 1px solid rgba(255,255,255,.1);
  padding: 15px 9px 0;
}
.company-switcher {
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 10px;
  padding: 10px;
}
.company-switcher strong { display: block; font-size: 13px; }
.company-switcher span { color: #9cb9a8; font-size: 11px; }
.main {
  margin-left: var(--sidebar);
  min-height: 100vh;
}
.topbar {
  height: var(--header);
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(255,255,255,.94);
  border-bottom: 1px solid var(--line);
  padding: 0 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  backdrop-filter: blur(12px);
}
.topbar-left { display: flex; align-items: center; gap: 15px; }
.menu-toggle { display: none; }
.page-context { font-size: 13px; color: var(--muted); }
.page-context strong { color: var(--ink); display: block; font-size: 14px; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.icon-button {
  width: 38px;
  height: 38px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--surface);
  display: grid;
  place-items: center;
  color: var(--ink-2);
}
.icon-button:hover { background: var(--surface-3); }
.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--brand-soft);
  color: var(--brand-dark);
  display: grid;
  place-items: center;
  font-weight: 750;
  font-size: 12px;
}
.content { padding: 27px 28px 50px; max-width: 1540px; margin: 0 auto; }
.page-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 22px;
}
.page-heading p { margin: 0; color: var(--muted); }
.heading-actions { display: flex; gap: 9px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  border-radius: 9px;
  padding: 9px 14px;
  font-weight: 650;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 38px;
  transition: background .15s, border .15s, transform .1s;
}
.btn:hover { background: var(--surface-3); }
.btn:active { transform: translateY(1px); }
.btn-primary { color: white; background: var(--brand); border-color: var(--brand); }
.btn-primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
.btn-danger { color: var(--danger); background: var(--danger-soft); border-color: #efc8c8; }
.btn-danger:hover { background: #f9dada; }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--surface-3); }
.btn-sm { padding: 5px 9px; min-height: 30px; font-size: 12px; border-radius: 7px; }
.btn-icon { width: 34px; padding: 0; }
.btn svg { width: 16px; height: 16px; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}
.card-header {
  padding: 17px 19px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.card-header h2, .card-header h3 { margin: 0; }
.card-body { padding: 19px; }
.card-footer { padding: 14px 19px; border-top: 1px solid var(--line); background: var(--surface-2); }
.grid { display: grid; gap: 17px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stat-card { padding: 17px 18px; display: flex; gap: 13px; align-items: center; }
.stat-icon {
  width: 42px;
  height: 42px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: var(--brand-soft);
  color: var(--brand);
  flex: 0 0 auto;
}
.stat-icon.blue { background: var(--info-soft); color: var(--info); }
.stat-icon.gold { background: var(--accent-soft); color: var(--warning); }
.stat-icon.red { background: var(--danger-soft); color: var(--danger); }
.stat-icon svg { width: 21px; height: 21px; }
.stat-value { font-size: 24px; font-weight: 750; line-height: 1.15; letter-spacing: -.6px; }
.stat-label { color: var(--muted); font-size: 12px; margin-top: 2px; }
.stat-trend { font-size: 11px; margin-top: 4px; color: var(--success); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
.form-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.field { min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label, .field-label {
  display: block;
  font-size: 12px;
  font-weight: 680;
  color: var(--ink-2);
  margin-bottom: 6px;
}
.required::after { content: " *"; color: var(--danger); }
.input, .select, .textarea {
  width: 100%;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  border-radius: 8px;
  padding: 9px 10px;
  min-height: 39px;
  outline: none;
  transition: border .15s, box-shadow .15s;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(23,107,69,.11);
}
.input.invalid, .select.invalid, .textarea.invalid { border-color: var(--danger); }
.textarea { resize: vertical; min-height: 92px; }
.input-group { display: flex; }
.input-group .input { border-radius: 8px 0 0 8px; }
.input-group .btn { border-radius: 0 8px 8px 0; margin-left: -1px; min-height: 39px; }
.field-hint { font-size: 11px; color: var(--muted); margin-top: 5px; }
.field-error { color: var(--danger); font-size: 11px; margin-top: 5px; display: none; }
.field-error.show { display: block; }
.checkbox { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; cursor: pointer; }
.checkbox input { margin-top: 3px; accent-color: var(--brand); }
.radio-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.radio-card { position: relative; }
.radio-card input { position: absolute; opacity: 0; pointer-events: none; }
.radio-card span {
  display: block;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 10px;
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 620;
  cursor: pointer;
  text-align: center;
}
.radio-card input:checked + span { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-dark); }
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 99px;
  padding: 4px 9px;
  font-size: 11px;
  font-weight: 680;
  white-space: nowrap;
}
.badge-green { background: var(--success-soft); color: var(--success); }
.badge-blue { background: var(--info-soft); color: var(--info); }
.badge-gold { background: var(--warning-soft); color: var(--warning); }
.badge-red { background: var(--danger-soft); color: var(--danger); }
.badge-gray { background: var(--surface-3); color: var(--ink-2); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left;
  padding: 10px 15px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .8px;
  text-transform: uppercase;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  font-weight: 750;
  white-space: nowrap;
}
td { padding: 13px 15px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: #fcfdfc; }
.table-primary { font-weight: 680; }
.table-secondary { color: var(--muted); font-size: 12px; margin-top: 2px; }
.row-actions { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.search-wrap { position: relative; flex: 1; min-width: 210px; max-width: 430px; }
.search-wrap svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  color: var(--muted);
}
.search-wrap .input { padding-left: 33px; }
.toolbar-spacer { flex: 1; }
.empty-state {
  padding: 52px 25px;
  text-align: center;
  color: var(--muted);
}
.empty-icon {
  width: 55px;
  height: 55px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  margin: 0 auto 14px;
  background: var(--surface-3);
  color: var(--brand);
}
.empty-icon svg { width: 26px; height: 26px; }
.empty-state h3 { color: var(--ink); margin-bottom: 6px; }
.empty-state p { max-width: 440px; margin: 0 auto 16px; }
.segmented { display: inline-flex; background: var(--surface-3); border-radius: 9px; padding: 3px; gap: 2px; }
.segmented button {
  border: 0;
  background: transparent;
  border-radius: 7px;
  padding: 7px 11px;
  font-size: 12px;
  color: var(--ink-2);
  font-weight: 650;
}
.segmented button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
.progress { height: 6px; background: var(--surface-3); border-radius: 99px; overflow: hidden; }
.progress > div { height: 100%; background: var(--brand); border-radius: inherit; transition: width .25s; }
.builder-layout { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 18px; align-items: start; }
.builder-main { min-width: 0; }
.steps { display: flex; gap: 0; margin-bottom: 18px; overflow-x: auto; }
.step {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--muted);
  white-space: nowrap;
  min-width: 150px;
}
.step:first-child { border-radius: 10px 0 0 10px; }
.step:last-child { border-radius: 0 10px 10px 0; }
.step + .step { border-left: 0; }
.step-number {
  width: 23px;
  height: 23px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--surface-3);
  font-size: 11px;
  font-weight: 750;
}
.step.active { color: var(--brand-dark); background: var(--brand-soft); border-color: #b8ddc8; }
.step.active .step-number { background: var(--brand); color: white; }
.step.complete .step-number { background: var(--success-soft); color: var(--success); }
.builder-section { display: none; }
.builder-section.active { display: block; }
.form-section { margin-bottom: 17px; }
.form-section h3 { display: flex; align-items: center; gap: 8px; }
.form-section h3 svg { width: 17px; color: var(--brand); }
.section-note { background: var(--info-soft); color: #305d7c; border-radius: 8px; padding: 10px 12px; font-size: 12px; margin-bottom: 15px; }
.summary-panel { position: sticky; top: calc(var(--header) + 18px); }
.summary-customer { padding: 16px; border-bottom: 1px solid var(--line); }
.summary-customer strong { display: block; }
.summary-customer span { color: var(--muted); font-size: 12px; }
.line-items { padding: 7px 16px; max-height: 270px; overflow-y: auto; }
.summary-line {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px dashed var(--line);
  font-size: 12px;
}
.summary-line:last-child { border: 0; }
.summary-line span:first-child { color: var(--ink-2); }
.summary-line span:last-child { white-space: nowrap; font-weight: 650; }
.summary-totals { padding: 14px 16px; background: var(--surface-2); border-top: 1px solid var(--line); }
.total-row { display: flex; justify-content: space-between; padding: 4px 0; color: var(--ink-2); font-size: 12px; }
.total-row.grand { font-size: 17px; font-weight: 780; color: var(--ink); padding-top: 11px; margin-top: 7px; border-top: 1px solid var(--line-strong); }
.total-row .muted { color: var(--muted); }
.price-lock {
  margin: 12px 16px 16px;
  border: 1px solid #efd7a8;
  background: var(--accent-soft);
  border-radius: 9px;
  padding: 10px;
  font-size: 11px;
  color: #79521a;
}
.price-lock button { border: 0; background: transparent; color: #714810; font-weight: 750; padding: 0; text-decoration: underline; }
.template-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 15px; }
.template-card { overflow: hidden; transition: transform .15s, box-shadow .15s; }
.template-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.template-visual {
  height: 92px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #dcece2, #f4f7f3);
  display: grid;
  place-items: center;
}
.template-visual svg { width: 54px; height: 54px; color: var(--brand); opacity: .78; }
.template-visual .version {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(255,255,255,.9);
  border-radius: 99px;
  padding: 3px 8px;
  font-size: 10px;
  font-weight: 700;
  color: var(--ink-2);
}
.template-content { padding: 16px; }
.template-content h3 { margin-bottom: 4px; }
.template-content p { color: var(--muted); font-size: 12px; min-height: 37px; margin-bottom: 12px; }
.template-meta { display: flex; justify-content: space-between; color: var(--ink-2); font-size: 11px; margin-bottom: 14px; }
.template-actions { display: flex; gap: 7px; }
.template-actions .btn { flex: 1; }
.price-book-table td:first-child { font-weight: 650; }
.price-book-table .edit-price { width: 90px; }
.price-book-table input { padding: 6px 8px; min-height: 32px; text-align: right; }
.rate-category { background: var(--surface-3) !important; font-size: 11px !important; text-transform: uppercase; letter-spacing: .7px; color: var(--ink-2) !important; }
.activity { position: relative; padding-left: 22px; }
.activity::before { content: ""; position: absolute; left: 6px; top: 7px; bottom: 7px; width: 1px; background: var(--line); }
.activity-item { position: relative; padding-bottom: 19px; }
.activity-item:last-child { padding-bottom: 0; }
.activity-dot { position: absolute; left: -21px; top: 4px; width: 11px; height: 11px; border-radius: 50%; background: var(--surface); border: 3px solid var(--brand); }
.activity-item strong { font-size: 12px; }
.activity-item time { color: var(--muted); font-size: 11px; }
.activity-item p { color: var(--ink-2); font-size: 12px; margin: 4px 0 0; }
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(10,25,17,.48);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(2px);
}
.modal {
  width: min(650px, 100%);
  max-height: calc(100vh - 40px);
  overflow-y: auto;
  background: var(--surface);
  border-radius: 15px;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}
.modal.small { width: min(430px, 100%); }
.modal.large { width: min(920px, 100%); }
.modal-header { padding: 18px 20px; display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 1px solid var(--line); }
.modal-header h2 { margin: 0; }
.modal-header p { color: var(--muted); margin: 3px 0 0; font-size: 12px; }
.modal-body { padding: 20px; }
.modal-footer { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; background: var(--surface-2); }
.close-button { border: 0; background: transparent; width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.close-button:hover { background: var(--surface-3); }
.toast-region { position: fixed; right: 20px; bottom: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
.toast {
  background: #172a20;
  color: white;
  border-radius: 10px;
  padding: 12px 14px;
  box-shadow: 0 9px 28px rgba(0,0,0,.18);
  display: flex;
  gap: 10px;
  align-items: flex-start;
  animation: toast-in .2s ease-out;
}
.toast.success { border-left: 4px solid #5ac58d; }
.toast.error { border-left: 4px solid #ef7777; }
.toast.info { border-left: 4px solid #70a9d1; }
.toast svg { width: 17px; flex: 0 0 auto; margin-top: 1px; }
.toast button { margin-left: auto; background: transparent; border: 0; color: #a9bbb0; padding: 0; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.quote-paper {
  background: white;
  width: 100%;
  max-width: 820px;
  margin: 0 auto;
  box-shadow: 0 4px 22px rgba(30,50,38,.12);
  border: 1px solid var(--line);
  min-height: 1000px;
  padding: 46px;
}
.paper-head { display: flex; justify-content: space-between; gap: 25px; padding-bottom: 24px; border-bottom: 3px solid var(--brand); }
.paper-logo { display: flex; align-items: center; gap: 10px; }
.paper-logo .brand-mark { width: 42px; height: 42px; }
.paper-logo h2 { margin: 0; font-size: 20px; }
.paper-logo p { margin: 1px 0 0; color: var(--muted); font-size: 11px; }
.quote-number { text-align: right; font-size: 12px; }
.quote-number strong { display: block; font-size: 18px; }
.paper-parties { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; padding: 22px 0; }
.paper-parties h4 { text-transform: uppercase; letter-spacing: 1px; font-size: 10px; color: var(--muted); margin-bottom: 7px; }
.paper-parties p { margin: 0; font-size: 13px; }

.notice {

.notice.danger { background: var(--danger-soft); color: var(--danger); }

  const d = new Date();
  d.setDate(d.getDate() + n);

let state = loadState();
let draft = null;
let draftDirty = false;
let modalCleanup = null;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      const initial = seedState();
      saveState(initial);
      return initial;
    }
    const parsed = JSON.parse(raw);
    return migrateState(parsed);
  } catch (error) {
    console.error("State could not be loaded", error);
    const initial = seedState();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(initial)); } catch (_) {}
    return initial;
  }
}

function migrateState(saved) {
  const fresh = seedState();
  const merged = {
    ...fresh,
    ...saved,
    company: { ...fresh.company, ...(saved.company || {}) },
    currentUser: { ...fresh.currentUser, ...(saved.currentUser || {}) },
    priceBook: saved.priceBook || fresh.priceBook,
    templates: Array.isArray(saved.templates) ? saved.templates : fresh.templates,
    quotes: Array.isArray(saved.quotes) ? saved.quotes : fresh.quotes,
    team: Array.isArray(saved.team) ? saved.team : fresh.team,
    notifications: Array.isArray(saved.notifications) ? saved.notifications : fresh.notifications,
    ui: { ...fresh.ui, ...(saved.ui || {}) }
  };
  merged.quotes.forEach(q => {
    q.items = Array.isArray(q.items) ? q.items : [];
    q.activity = Array.isArray(q.activity) ? q.activity : [];
    q.photos = Array.isArray(q.photos) ? q.photos : [];
    q.rateSnapshot = q.rateSnapshot || {};
    q.approval = q.approval || null;
    if (!q.tree) q.tree = { count: 1, height: 20, diameter: 12, condition: "Good", location: "Residential yard", access: "Standard access", debrisVolume: 1, disposal: "Haul away", notes: "" };
  });
  return merged;
}

function saveState(next = state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
    return true;
  } catch (error) {
    console.error(error);
    toast("Your changes could not be saved. Check browser storage permissions.", "error");
    return false;
  }
}

function recalculateQuote(quote) {
  let subtotal = 0;
  let taxable = 0;
  quote.items.forEach(item => {
    const rate = getRate(item.rateId);
    const storedRate = Number(item.lockedRate);
    const unitRate = Number.isFinite(storedRate) ? storedRate : (rate ? rate.rate : 0);
    item.unitRate = unitRate;
    item.amount = unitRate * Number(item.qty || 0);
    subtotal += item.amount;
    if (item.taxable !== false) taxable += item.amount;
  });
  const taxRate = Number(quote.taxRate ?? state.company.taxRate);
  quote.subtotal = subtotal;
  quote.tax = taxable * taxRate / 100;
  quote.total = subtotal + quote.tax;
  quote.marginPercent = Number(quote.marginPercent ?? state.company.defaultMargin);
  quote.updatedAt = nowISO();
  return quote;
}

function getRate(id) {
  for (const category of Object.values(state.priceBook)) {
    const found = category.find(r => r.id === id);
    if (found) return found;
  }
  return null;
}

function quoteStatusClass(status) {
  return ({
    Draft: "badge-gray",
    Sent: "badge-blue",
    "Viewed": "badge-gold",
    Approved: "badge-green",
    Declined: "badge-red",
    Expired: "badge-gray"
  })[status] || "badge-gray";
}

function serviceIcon(service) {
  if (service === "Removal") return icons.tree;
  if (service === "Stump grinding") return icons.bolt;
  if (service === "Cabling") return icons.check;
  if (service === "Emergency") return icons.alert;
  return icons.tree;
}

function toast(message, type = "success", duration = 3600) {
  const region = document.getElementById("toastRegion");
  const el = document.createElement("div");
  el.className = "toast " + type;
  const icon = type === "error" ? icons.alert : type === "info" ? icons.info : icons.check;
  el.innerHTML = icon + "<span>" + escapeHTML(message) + "</span><button aria-label='Dismiss'>×</button>";
  const timer = setTimeout(() => el.remove(), duration);
  el.querySelector("button").addEventListener("click", () => {
    clearTimeout(timer);
    el.remove();
  });
  region.appendChild(el);
}

function setView(view, options = {}) {
  if (!["dashboard", "quotes", "builder", "templates", "pricebook", "team"].includes(view)) view = "dashboard";
  if (view !== "builder" && draftDirty && !options.skipGuard) {
    const leave = confirm("You have unsaved quote changes. Leave the builder without saving?");
    if (!leave) return;
    draftDirty = false;
  }
  if (view !== "builder") {
    draft = null;
    state.ui.editingQuoteId = null;
  }
  state.ui.currentView = view;
  saveState();
  document.querySelectorAll(".view-panel").forEach(el => el.classList.add("hidden"));
  document.getElementById("view-" + view).classList.remove("hidden");
  document.querySelectorAll(".nav-item").forEach(el => el.classList.toggle("active", el.dataset.view === view));
  const titles = { dashboard: "Dashboard", quotes: "Quotes", builder: draft ? "Quote builder" : "Quote builder", templates: "Job templates", pricebook: "Price book", team: "Team & activity" };
  document.getElementById("pageTitle").textContent = titles[view];
  renderView(view);
  document.body.classList.remove("sidebar-open");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderView(view) {
  if (view === "dashboard") renderDashboard();
  if (view === "quotes") renderQuotes();
  if (view === "builder") renderBuilder();
  if (view === "templates") renderTemplates();
  if (view === "pricebook") renderPriceBook();
  if (view === "team") renderTeam();
  updateNavCounts();
}

  document.getElementById("quoteCountNav").textContent = state.quotes.length;

function greeting() {
  const hour = new Date().getHours();
  if (hour < 12) return "morning";
  if (hour < 18) return "afternoon";
  return "evening";

function daysUntil(dateString) {
  const diff = new Date(dateString) - new Date();
  return Math.max(0, Math.ceil(diff / 86400000));
}

              <button class="btn btn-sm btn-icon" data-duplicate-quote="${q.id}" title="Duplicate quote" aria-label="Duplicate ${escapeHTML(q.number)}">${icons.copy}</button>
            </div></td>
          </tr>`;
        }).join("")}</tbody></table></div>` : emptyState(icons.search, "No matching quotes", query || status !== "All statuses" || service !== "All services" ? "Try changing your search or filters." : "Create a quote to start tracking customer proposals.", `<button class="btn btn-primary" data-action="new-quote">${icons.plus} Create a quote</button>`)}
    </div>`;
  const search = document.getElementById("quoteSearch");
  search.addEventListener("input", e => {
    state.ui.quoteSearch = e.target.value;
    saveState();
    const pos = e.target.selectionStart;
    renderQuotes();
    const next = document.getElementById("quoteSearch");
    next.focus();
    next.setSelectionRange(pos, pos);
  });
  document.getElementById("quoteStatusFilter").addEventListener("change", e => { state.ui.quoteStatus = e.target.value; saveState(); renderQuotes(); });
  document.getElementById("quoteServiceFilter").addEventListener("change", e => { state.ui.quoteService = e.target.value; saveState(); renderQuotes(); });
}

function createBlankQuote(template = null) {
  const quote = {
    id: uid("quote"),
    number: nextQuoteNumber(),
    customer: { name: "", contact: "", email: "", phone: "", address: "" },
    service: template?.service || "Pruning",
    status: "Draft",
    createdAt: nowISO(),
    updatedAt: nowISO(),
    validUntil: daysFromNow(30),
    assignedTo: state.currentUser.id,
    templateId: template?.id || "",
    tree: { count: 1, height: 25, diameter: 14, condition: "Good", location: "Residential yard", access: "Standard access", debrisVolume: 1, disposal: "Haul away", notes: "" },
    items: [],
    exclusions: template ? clone(template.exclusions) : ["Work outside the described scope", "Permit and inspection fees", "Unforeseen underground conditions"],
    assumptions: template ? clone(template.assumptions) : ["Work performed during normal business hours", "Customer provides safe access to the work area"],
    notes: "",
    photos: [],
    subtotal: 0,
    tax: 0,
    total: 0,
    taxRate: state.company.taxRate,
    marginPercent: state.company.defaultMargin,
    rateSnapshot: {},
    approval: null,
    activity: []
  };
  if (template) {
    quote.items = template.defaultItems.map(item => ({
      ...clone(item),
      id: uid("li"),
      lockedRate: getRate(item.rateId)?.rate ?? 0,
      unitRate: getRate(item.rateId)?.rate ?? 0
    }));
    quote.templateVersion = template.version;
    quote.activity.push({
      id: uid("act"),
      user: state.currentUser.name,
      action: "Created quote",
      detail: `Quote created from ${template.name} v${template.version}.`,
      at: nowISO()
    });
  }
  return quote;
}

function nextQuoteNumber() {
  const numbers = state.quotes.map(q => {
    const m = String(q.number).match(/(\d+)$/);
    return m ? parseInt(m[1], 10) : 1040;
  });
  const next = Math.max(1048, ...numbers) + 1;
  return `${state.company.quotePrefix}-${next}`;
}

function startNewQuote(template = null) {
  if (draftDirty && !confirm("Discard your unsaved changes and start a new quote?")) return;
  draft = createBlankQuote(template);
  draftDirty = false;
  state.ui.builderStep = 1;
  state.ui.editingQuoteId = null;
  state.ui.currentView = "builder";
  saveState();
  setView("builder", { skipGuard: true });
}

function editQuote(id) {
  const quote = state.quotes.find(q => q.id === id);
  if (!quote) return toast("That quote could not be found.", "error");
  if (draftDirty && !confirm("Discard your unsaved changes and open this quote?")) return;
  draft = clone(quote);
  draftDirty = false;
  state.ui.editingQuoteId = id;
  state.ui.builderStep = 1;
  state.ui.currentView = "builder";
  saveState();
  setView("builder", { skipGuard: true });
}

function duplicateQuote(id) {
  const original = state.quotes.find(q => q.id === id);
  if (!original) return;
  const copy = clone(original);
  copy.id = uid("quote");
  copy.number = nextQuoteNumber();
  copy.status = "Draft";
  copy.createdAt = nowISO();
  copy.updatedAt = nowISO();
  copy.validUntil = daysFromNow(30);
  copy.approval = null;
  copy.activity = [{
    id: uid("act"), user: state.currentUser.name, action: "Duplicated quote",
    detail: `Duplicated from ${original.number}.`, at: nowISO()
  }];
  state.quotes.unshift(copy);
  saveState();
  toast(`${copy.number} duplicated.`);
  renderQuotes();
}

function renderLineItems() {

  return draft.items.map(item => {
    const rate = getRate(item.rateId);
    return `<tr data-line-id="${item.id}">
      <td><input class="input" data-item="description" value="${escapeHTML(item.description)}" aria-label="Line item description"></td>
      <td><select class="select" data-item="type" aria-label="Category">${["labor","equipment","disposal","travel"].map(t => `<option value="${t}" ${item.type === t ? "selected" : ""}>${t[0].toUpperCase()+t.slice(1)}</option>`).join("")}</select></td>
      <td><select class="select" data-item="rateId" aria-label="Rate item">${(state.priceBook[item.type] || []).map(r => `<option value="${r.id}" ${item.rateId === r.id ? "selected" : ""}>${escapeHTML(r.name)}</option>`).join("") || '<option value="">No rates available</option>'}</select></td>
      <td><input type="number" step="0.25" min="0" class="input" data-item="qty" value="${item.qty}" aria-label="Quantity"></td>
      <td><input type="number" step="0.01" min="0" class="input" data-item="lockedRate" value="${Number(item.lockedRate ?? rate?.rate ?? 0)}" aria-label="Rate"></td>
      <td class="table-primary" data-line-amount>${money(item.amount)}</td>
      <td><button class="btn btn-sm btn-icon btn-danger" data-remove-item="${item.id}" aria-label="Remove line item">${icons.trash}</button></td>
    </tr>`;
  }).join("");
}

function bindBuilderEvents() {
  document.querySelectorAll("[data-builder-step]").forEach(btn => btn.addEventListener("click", () => {
    state.ui.builderStep = Number(btn.dataset.builderStep);
    saveState();
    renderBuilder();
  }));
  document.querySelectorAll("[data-draft]").forEach(el => {
    const eventName = el.tagName === "SELECT" || el.type === "checkbox" || el.type === "date" ? "change" : "input";
    el.addEventListener(eventName, () => {
      let value = el.type === "checkbox" ? el.checked : el.value;
      if (["tree.count","tree.height","tree.diameter","tree.debrisVolume","taxRate","marginPercent","depositPercent","complexityMode"].includes(el.dataset.draft)) value = Number(value);
      setDraftPath(el.dataset.draft, value);
      draftDirty = true;
      if (el.dataset.draft === "customer.name" || el.dataset.draft === "customer.address") {
        const name = document.getElementById("summaryCustomerName");
        const address = document.getElementById("summaryCustomerLocation");
        if (name) name.textContent = draft.customer.name || "New customer";
        if (address) address.textContent = draft.customer.address || "Address not added";
      }
      if (el.dataset.draft === "taxRate" || el.dataset.draft === "marginPercent" || el.dataset.draft === "complexityMode") {
        recalculateQuote(draft);
        refreshBuilderPricing();
      }
    });
  });
  document.querySelectorAll("[data-list]").forEach(el => el.addEventListener("input", () => {
    draft[el.dataset.list] = el.value.split("\n").map(x => x.trim()).filter(Boolean);
    draftDirty = true;
  }));
  document.querySelectorAll("[data-item]").forEach(el => {
    el.addEventListener(el.tagName === "SELECT" ? "change" : "input", () => {
      const row = el.closest("[data-line-id]");
      const item = draft.items.find(i => i.id === row.dataset.lineId);
      if (!item) return;
      const field = el.dataset.item;
      if (field === "type") {
        item.type = el.value;
        const first = (state.priceBook[el.value] || [])[0];
        if (first) {
          item.rateId = first.id;
          item.lockedRate = first.rate;
        }
        renderBuilder();
      } else {
        item[field] = ["qty","lockedRate"].includes(field) ? Number(el.value) : el.value;
      }
      recalculateQuote(draft);
      draftDirty = true;
      refreshBuilderPricing();
    });
  });
  document.querySelectorAll("[data-remove-item]").forEach(btn => btn.addEventListener("click", () => {
    draft.items = draft.items.filter(i => i.id !== btn.dataset.removeItem);
    recalculateQuote(draft);
    draftDirty = true;
    renderBuilder();
  }));
  const photoInput = document.getElementById("photoInput");
  if (photoInput) photoInput.addEventListener("change", handlePhotos);
  document.querySelectorAll("[data-remove-photo]").forEach(btn => btn.addEventListener("click", () => {
    draft.photos.splice(Number(btn.dataset.removePhoto), 1);
    draftDirty = true;
    renderBuilder();
  }));
}

function setDraftPath(path, value) {
  const parts = path.split(".");
  let target = draft;
  for (let i = 0; i < parts.length - 1; i++) {
    if (target[parts[i]] === undefined) target[parts[i]] = {};
    target = target[parts[i]];
  }
  target[parts[parts.length - 1]] = value;
}

function refreshBuilderPricing() {
  document.querySelectorAll("[data-line-id]").forEach(row => {
    const item = draft.items.find(i => i.id === row.dataset.lineId);
    const amount = row.querySelector("[data-line-amount]");
    if (item && amount) amount.textContent = money(item.amount);
  });

  }
}

function handlePhotos(e) {
  const files = Array.from(e.target.files || []);
  if (!files.length) return;
  let loaded = 0;
  files.forEach(file => {
    if (!file.type.startsWith("image/")) return;
    if (file.size > 4 * 1024 * 1024) {
      toast(`${file.name} is too large. Use an image under 4 MB.`, "error");
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      draft.photos.push({ name: file.name, data: reader.result });
      loaded++;
      if (loaded === files.length) {
        draftDirty = true;
        renderBuilder();
        toast(`${loaded} photo${loaded === 1 ? "" : "s"} attached.`);
      }
    };
    reader.onerror = () => toast(`Could not read ${file.name}.`, "error");
    reader.readAsDataURL(file);
  });
  e.target.value = "";
}

function validateBuilder(step = state.ui.builderStep) {
  clearValidation();
  const errors = [];
  if (step === 1) {
    if (!draft.customer.name.trim()) errors.push(["customerName", "Enter a customer or company name."]);
    if (!draft.customer.contact.trim()) errors.push(["contactName", "Enter a primary contact."]);
    if (!draft.customer.email.trim()) errors.push(["customerEmail", "Enter an email address."]);
    else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(draft.customer.email)) errors.push(["customerEmail", "Enter a valid email address."]);
    if (!draft.customer.address.trim()) errors.push(["customerAddress", "Enter the service address."]);
    if (!draft.validUntil || new Date(draft.validUntil) < new Date()) errors.push(["validUntil", "Validity date must be today or later."]);
  }
  if (step === 2) {
    if (!draft.tree.count || draft.tree.count < 1) errors.push(["treeCount", "At least one tree is required."]);
  }
  if (step === 3 && !draft.items.length) {
    toast("Add at least one pricing line item before continuing.", "error");
    return false;
  }
  errors.forEach(([id, message]) => {
    const input = document.getElementById(id);
    if (input) {
      input.classList.add("invalid");
      const error = document.querySelector(`[data-error-for="${id}"]`);
      if (error) { error.textContent = message; error.classList.add("show"); }
    }
  });
  if (errors.length) {
    toast(errors[0][1], "error");
    document.querySelector(".invalid")?.focus();
    return false;
  }
  return true;
}

function clearValidation() {
  document.querySelectorAll(".invalid").forEach(el => el.classList.remove("invalid"));
  document.querySelectorAll(".field-error").forEach(el => { el.classList.remove("show"); el.textContent = ""; });
}

function saveDraftQuote(silent = false) {
  if (!validateBuilder(1)) return false;
  if (!validateBuilder(3)) return false;
  recalculateQuote(draft);
  draft.rateSnapshot = {};
  draft.items.forEach(item => draft.rateSnapshot[item.rateId] = Number(item.lockedRate ?? 0));
  const existingIndex = state.quotes.findIndex(q => q.id === draft.id);
  const action = existingIndex >= 0 ? "Updated quote" : "Created quote";
  draft.activity = draft.activity || [];
  const last = draft.activity[draft.activity.length - 1];
  if (!last || last.action !== action || last.at !== draft.updatedAt) {
    draft.activity.push({
      id: uid("act"), user: state.currentUser.name, action,
      detail: existingIndex >= 0 ? "Quote details and pricing updated." : "Quote saved as a draft.",
      at: nowISO()
    });
  }
  if (existingIndex >= 0) state.quotes[existingIndex] = clone(draft);
  else state.quotes.unshift(clone(draft));
  state.ui.editingQuoteId = draft.id;
  draftDirty = false;
  saveState();
  if (!silent) toast(`${draft.number} saved.`);
  return true;
}

function addLineItem() {
  const type = "labor";
  const rate = state.priceBook[type]?.[0];
  const item = {
    id: uid("li"),
    description: rate?.name || "New service item",
    type,
    rateId: rate?.id || "",
    qty: 1,
    lockedRate: rate?.rate || 0,
    taxable: true
  };
  draft.items.push(item);
  recalculateQuote(draft);
  draftDirty = true;
  renderBuilder();
  setTimeout(() => {
    const rows = document.querySelectorAll("[data-line-id]");
    const last = rows[rows.length - 1];
    last?.querySelector('[data-item="description"]')?.focus();
  }, 30);
}

function refreshDraftRates() {
  if (!draft) return;
  draft.items.forEach(item => {
    const rate = getRate(item.rateId);
    if (rate) {
      item.lockedRate = rate.rate;
      item.unitRate = rate.rate;
    }
  });
  draft.rateSnapshot = {};
  recalculateQuote(draft);
  draftDirty = true;
  renderBuilder();
  toast("Draft rates refreshed from the current price book.");
}

function openModal(html, size = "") {
  closeModal();
  const root = document.getElementById("modalRoot");
  root.innerHTML = `<div class="modal-backdrop" role="presentation"><div class="modal ${size}" role="dialog" aria-modal="true" aria-labelledby="modalTitle">${html}</div></div>`;
  const backdrop = root.querySelector(".modal-backdrop");
  backdrop.addEventListener("mousedown", e => { if (e.target === backdrop) closeModal(); });
  root.querySelectorAll("[data-close-modal]").forEach(btn => btn.addEventListener("click", closeModal));
  document.body.style.overflow = "hidden";
  setTimeout(() => root.querySelector("input,select,textarea,button")?.focus(), 20);
  return root.querySelector(".modal");
}

function closeModal() {
  document.getElementById("modalRoot").innerHTML = "";
  document.body.style.overflow = "";
  if (modalCleanup) {
    modalCleanup();
    modalCleanup = null;
  }
}

    <div class="modal-header"><div><h2 id="modalTitle">${escapeHTML(q.number)} · ${escapeHTML(q.customer.name)}</h2><p>Customer-facing web proposal</p></div><button class="close-button" data-close-modal aria-label="Close">${icons.x}</button></div>
    <div class="modal-body" style="background:var(--surface-3)">${quotePaperHTML(q)}</div>
    <div class="modal-footer no-print"><button class="btn" data-close-modal>Close</button><button class="btn" data-action="duplicate-from-preview" data-id="${q.id}">${icons.copy} Duplicate</button><button class="btn" data-action="compare-quote" data-id="${q.id}">Compare scope</button><button class="btn btn-primary" data-action="send-quote" data-id="${q.id}">${icons.send} Share quote</button><button class="btn" data-action="print-quote" data-id="${q.id}">${icons.print} Print / PDF</button></div>
  `, "large");
  modal.querySelector('[data-action="print-quote"]').addEventListener("click", () => {

    win.document.close();
  });
  modal.querySelector('[data-action="duplicate-from-preview"]').addEventListener("click", () => { closeModal(); duplicateQuote(q.id); });
  modal.querySelector('[data-action="compare-quote"]').addEventListener("click", () => { closeModal(); compareQuote(q.id); });
  modal.querySelector('[data-action="send-quote"]').addEventListener("click", () => { closeModal(); sendQuote(q.id); });
}

function sendQuote(id) {
  const q = state.quotes.find(x => x.id === id);
  if (!q) return;
  if (!q.customer.email) { toast("Add a customer email before sharing this quote.", "error"); return; }
  const modal = openModal(`
    <div class="modal-header"><div><h2 id="modalTitle">Share ${escapeHTML(q.number)}</h2><p>Send a professional proposal to ${escapeHTML(q.customer.name)}</p></div><button class="close-button" data-close-modal>${icons.x}</button></div>
    <div class="modal-body">
      <div class="notice info">${icons.info}<span>This demo sends the proposal in-app. The quote status and activity log update immediately.</span></div>
      <div class="form-grid">
        <div class="field full"><label for="sendTo">Recipient email</label><input id="sendTo" class="input" type="email" value="${escapeHTML(q.customer.email)}"></div>
        <div class="field full"><label for="sendSubject">Email subject</label><input id="sendSubject" class="input" value="Your tree service estimate from ${escapeHTML(state.company.name)}"></div>
        <div class="field full"><label for="sendMessage">Message</label><textarea id="sendMessage" class="textarea">Hi ${escapeHTML(q.customer.contact || q.customer.name)},\n\nThank you for the opportunity to provide a tree service estimate. Please review the attached estimate and reply with any questions.\n\nBest,\n${escapeHTML(state.company.name)}</textarea></div>
      </div>
      <label class="checkbox" style="margin-top:14px"><input id="includePortal" type="checkbox" checked><span>Include secure web quote and digital acceptance link</span></label>
    </div>
    <div class="modal-footer"><button class="btn" data-close-modal>Cancel</button><button class="btn btn-primary" data-action="confirm-send" data-id="${q.id}">${icons.send} Send proposal</button></div>
  `, "small");
  modal.querySelector('[data-action="confirm-send"]').addEventListener("click", () => {

    q.customer.email = email;
    q.status = "Sent";
    q.updatedAt = nowISO();

    saveState();
    closeModal();
    toast(`Proposal sent to ${email}.`);
    renderView(state.ui.currentView);
  });
}

function compareQuote(id) {
  const q = state.quotes.find(x => x.id === id);
  if (!q) return;
  const template = state.templates.find(t => t.id === q.templateId);
  const estimated = q.notes || `${q.service} service for ${q.tree.count} tree${q.tree.count === 1 ? "" : "s"}.`;
  const approved = q.approval?.scope || (q.status === "Approved" ? "Approved service scope as described in the estimate." : "No approved scope recorded yet.");
  const differences = [];
  if (q.status !== "Approved") differences.push("Scope has not been approved by an owner or manager.");
  if (q.tree.condition !== "Good") differences.push(`Tree condition is ${q.tree.condition.toLowerCase()}, which may affect the final scope.`);
  if (q.tree.access !== "Standard access") differences.push(`Site access is “${q.tree.access}”; confirm the equipment plan remains valid.`);
  if (q.tree.debrisVolume > 2) differences.push("Debris volume may require an additional disposal load.");
  if (q.tree.disposal === "Stump grind") differences.push("Stump grinding is specified in tree details but not included in pricing exclusions.");
  const modal = openModal(`
    <div class="modal-header"><div><h2 id="modalTitle">Compare estimated vs. approved scope</h2><p>${escapeHTML(q.number)} · ${escapeHTML(q.customer.name)}</p></div><button class="close-button" data-close-modal>${icons.x}</button></div>
    <div class="modal-body">
      <div class="compare-grid">
        <div class="card"><div class="card-header"><h3>Estimated scope</h3><span class="badge badge-blue">${escapeHTML(q.status)}</span></div><div class="card-body"><p style="font-size:13px">${escapeHTML(estimated)}</p><ul class="compare-list">${q.assumptions.map(x => `<li><strong>${escapeHTML(x)}</strong></li>`).join("")}</ul></div></div>
        <div class="card"><div class="card-header"><h3>Approved scope</h3><span class="badge ${q.status === "Approved" ? "badge-green" : "badge-gray"}">${q.status === "Approved" ? "Approved" : "Pending"}</span></div><div class="card-body"><p style="font-size:13px">${escapeHTML(approved)}</p>${q.approval ? `<div class="muted" style="font-size:11px">Approved by ${escapeHTML(q.approval.approvedBy)} on ${date(q.approval.approvedAt)}</div>` : '<p class="muted" style="font-size:12px">Approval will record the final agreed scope here.</p>'}</div></div>
      </div>
      <div class="card" style="margin-top:17px"><div class="card-header"><h3>Scope review notes</h3><span class="badge badge-gold">${differences.length}</span></div><div class="card-body">${differences.length ? `<ul style="font-size:12px;padding-left:18px">${differences.map(d => `<li style="margin-bottom:6px">${escapeHTML(d)}</li>`).join("")}</ul>` : '<p class="muted" style="font-size:12px;margin:0">No material scope differences found.</p>'}</div></div>
      ${template ? `<div class="notice info" style="margin-top:17px">${icons.info}<span>Based on ${escapeHTML(template.name)} v${template.version}. Template changes do not modify this quote.</span></div>` : ""}
    </div>
    <div class="modal-footer"><button class="btn" data-close-modal>Close</button>${q.status !== "Approved" ? `<button class="btn btn-primary" data-action="approve-quote" data-id="${q.id}">${icons.check} Approve scope</button>` : ""}</div>
  `, "large");
  const approveBtn = modal.querySelector('[data-action="approve-quote"]');
  if (approveBtn) approveBtn.addEventListener("click", () => approveQuote(q.id, approved));
}

function approveQuote(id, scope = "") {
  const q = state.quotes.find(x => x.id === id);
  if (!q) return;
  const modal = openModal(`
    <div class="modal-header"><div><h2 id="modalTitle">Approve ${escapeHTML(q.number)}</h2><p>Confirm pricing and the final agreed scope</p></div><button class="close-button" data-close-modal>${icons.x}</button></div>
    <div class="modal-body">
      <div class="field"><label for="approvalScope" class="required">Approved scope</label><textarea id="approvalScope" class="textarea" style="min-height:120px">${escapeHTML(scope || q.notes)}</textarea></div>
      <div class="notice warning" style="margin:15px 0 0">${icons.alert}<span>Approval records this scope and marks the quote as approved. It can still be revised by an owner.</span></div>
    </div>
    <div class="modal-footer"><button class="btn" data-close-modal>Cancel</button><button class="btn btn-primary" data-action="confirm-approval" data-id="${q.id}">Confirm approval</button></div>
  `, "small");
  modal.querySelector('[data-action="confirm-approval"]').addEventListener("click", () => {
    const value = modal.querySelector("#approvalScope").value.trim();
    if (!value) { toast("Describe the approved scope before approving.", "error"); return; }
    q.status = "Approved";
    q.approval = { approvedBy: state.currentUser.name, approvedAt: nowISO(), scope: value };
    q.updatedAt = nowISO();
    q.activity.push({ id: uid("act"), user: state.currentUser.name, action: "Approved quote", detail: "Scope and pricing approved.", at: nowISO() });
    saveState();
    closeModal();
    toast(`${q.number} approved.`);
    renderView(state.ui.currentView);
  });
}

function openTemplateEditor(id = null) {
  const template = id ? state.templates.find(t => t.id === id) : null;
  const item = template || {

    defaultItems: [{ id: uid("li"), description: "General arborist labor", type: "labor", rateId: state.priceBook.labor[0]?.id, qty: 2, taxable: true }],
    exclusions: [], assumptions: []
  };
  const modal = openModal(`
    <div class="modal-header"><div><h2 id="modalTitle">${template ? "Edit template" : "Create template"}</h2><p>${template ? `Version ${template.version}` : "Build a reusable job scope"}</p></div><button class="close-button" data-close-modal>${icons.x}</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field full"><label for="templateName" class="required">Template name</label><input id="templateName" class="input" value="${escapeHTML(item.name)}" placeholder="e.g. Large tree removal"></div>
        <div class="field"><label for="templateService">Service type</label><select id="templateService" class="select">${["Pruning","Removal","Stump grinding","Cabling","Emergency"].map(s => `<option ${item.service === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>
        <div class="field"><label for="templateHours">Base labor hours</label><input id="templateHours" type="number" min="0" step="0.25" class="input" value="${item.baseHours}"></div>
        <div class="field full"><label for="templateDescription">Description</label><textarea id="templateDescription" class="textarea">${escapeHTML(item.description)}</textarea></div>
      </div>
      <h3 style="margin-top:22px">Default pricing</h3>
      <div id="templateItems"></div>
      <button class="btn btn-sm" style="margin-top:9px" data-action="add-template-item">${icons.plus} Add pricing item</button>
      <div class="form-grid" style="margin-top:20px">
        <div class="field"><label for="templateExclusions">Exclusions</label><textarea id="templateExclusions" class="textarea">${escapeHTML(item.exclusions.join("\n"))}</textarea></div>
        <div class="field"><label for="templateAssumptions">Assumptions</label><textarea id="templateAssumptions" class="textarea">${escapeHTML(item.assumptions.join("\n"))}</textarea></div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn" data-close-modal>Cancel</button><button class="btn btn-primary" data-action="save-template" data-id="${id || ""}">${template ? "Save new version" : "Create template"}</button></div>
  `, "large");
  let workingItems = clone(item.defaultItems);
  function renderTemplateItems() {
    const container = modal.querySelector("#templateItems");
    container.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Description</th><th>Category</th><th>Rate item</th><th>Qty</th><th></th></tr></thead><tbody>${workingItems.map((x, i) => `<tr><td><input class="input" data-ti="description" data-index="${i}" value="${escapeHTML(x.description)}" aria-label="Description"></td><td><select class="select" data-ti="type" data-index="${i}">${["labor","equipment","disposal","travel"].map(t => `<option value="${t}" ${x.type === t ? "selected" : ""}>${t[0].toUpperCase()+t.slice(1)}</option>`).join("")}</select></td><td><select class="select" data-ti="rateId" data-index="${i}">${(state.priceBook[x.type] || []).map(r => `<option value="${r.id}" ${x.rateId === r.id ? "selected" : ""}>${escapeHTML(r.name)}</option>`).join("")}</select></td><td><input type="number" min="0" step="0.25" class="input" data-ti="qty" data-index="${i}" value="${x.qty}" aria-label="Quantity"></td><td><button class="btn btn-sm btn-icon btn-danger" data-remove-ti="${i}">${icons.trash}</button></td></tr>`).join("")}</tbody></table></div>`;
    container.querySelectorAll("[data-ti]").forEach(el => el.addEventListener(el.tagName === "SELECT" ? "change" : "input", () => {
      const x = workingItems[Number(el.dataset.index)];
      const field = el.dataset.ti;
      if (field === "type") {
        x.type = el.value;
        const first = state.priceBook[x.type]?.[0];
        if (first) x.rateId = first.id;
        renderTemplateItems();
      } else x[field] = field === "qty" ? Number(el.value) : el.value;
    }));
    container.querySelectorAll("[data-remove-ti]").forEach(btn => btn.addEventListener("click", () => { workingItems.splice(Number(btn.dataset.removeTi), 1); renderTemplateItems(); }));
  }
  renderTemplateItems();
  modal.querySelector('[data-action="add-template-item"]').addEventListener("click", () => {
    workingItems.push({ id: uid("li"), description: "General arborist labor", type: "labor", rateId: state.priceBook.labor[0]?.id, qty: 1, taxable: true });
    renderTemplateItems();
  });
  modal.querySelector('[data-action="save-template"]').addEventListener("click", () => {
    const name = modal.querySelector("#templateName").value.trim();
    if (!name) { toast("Enter a template name.", "error"); return; }
    const data = {
      name,
      service: modal.querySelector("#templateService").value,
      description: modal.querySelector("#templateDescription").value.trim(),
      baseHours: Number(modal.querySelector("#templateHours").value) || 0,
      defaultItems: workingItems,
      exclusions: modal.querySelector("#templateExclusions").value.split("\n").map(x => x.trim()).filter(Boolean),
      assumptions: modal.querySelector("#templateAssumptions").value.split("\n").map(x => x.trim()).filter(Boolean)
    };
    if (template) {
      const index = state.templates.findIndex(t => t.id === template.id);
      data.id = template.id;
      data.version = template.version + 1;
      data.updatedAt = nowISO();
      data.active = template.active;
      state.templates[index] = data;
      toast(`${name} saved as version ${data.version}. Existing quotes were not changed.`);
    } else {
      data.id = uid("tpl");
      data.version = 1;
      data.updatedAt = nowISO();
      data.active = true;
      state.templates.unshift(data);
      toast(`${name} template created.`);
    }
    saveState();
    closeModal();
    renderTemplates();
  });
}

document.addEventListener("click", event => {
  const viewBtn = event.target.closest("[data-view]");
  if (viewBtn) {
    setView(viewBtn.dataset.view);
    return;
  }
  const quoteRow = event.target.closest("[data-quote-row]");
  if (quoteRow) {
    previewQuote(quoteRow.dataset.quoteRow);
    return;
  }
  const previewBtn = event.target.closest("[data-view-quote]");
  if (previewBtn) {
    previewQuote(previewBtn.dataset.viewQuote);
    return;
  }
  const editBtn = event.target.closest("[data-edit-quote]");
  if (editBtn) {
    editQuote(editBtn.dataset.editQuote);
    return;
  }
  const duplicateBtn = event.target.closest("[data-duplicate-quote]");
  if (duplicateBtn) {
    duplicateQuote(duplicateBtn.dataset.duplicateQuote);
    return;
  }
  const useTemplate = event.target.closest("[data-use-template]");
  if (useTemplate) {
    const template = state.templates.find(t => t.id === useTemplate.dataset.useTemplate);
    if (template) startNewQuote(template);
    return;
  }
  const editTemplate = event.target.closest("[data-edit-template]");
  if (editTemplate) {
    openTemplateEditor(editTemplate.dataset.editTemplate);
    return;
  }
  const duplicateTpl = event.target.closest("[data-duplicate-template]");
  if (duplicateTpl) {
    duplicateTemplate(duplicateTpl.dataset.duplicateTemplate);
    return;
  }
  const memberQuotes = event.target.closest("[data-member-quotes]");
  if (memberQuotes) {
    state.ui.teamQuoteFilter = memberQuotes.dataset.memberQuotes;
    state.ui.quoteService = "All services";
    state.ui.quoteStatus = "All statuses";
    state.ui.quoteSearch = "";
    saveState();
    setView("quotes");
    return;
  }
  const actionBtn = event.target.closest("[data-action]");
  if (!actionBtn) return;
  const action = actionBtn.dataset.action;
  if (action === "new-quote") startNewQuote();
  if (action === "new-template") openTemplateEditor();
  if (action === "add-rate") openRateEditor();
  if (action === "invite-member") openInviteModal();
  if (action === "add-line-item") addLineItem();
  if (action === "refresh-rates") refreshDraftRates();
  if (action === "save-builder") {
    if (saveDraftQuote()) {
      const id = draft.id;
      setView("quotes", { skipGuard: true });
    }
  }
  if (action === "save-and-share") {
    if (saveDraftQuote()) {
      const id = draft.id;
      setView("quotes", { skipGuard: true });
      previewQuote(id);
    }
  }
  if (action === "save-company-rates") {
    const tax = Number(document.getElementById("defaultTax").value);
    const margin = Number(document.getElementById("defaultMargin").value);
    if (tax < 0 || tax > 30 || margin < 0 || margin > 90) { toast("Enter valid tax and margin percentages.", "error"); return; }
    state.company.taxRate = tax;
    state.company.defaultMargin = margin;
    saveState();
    toast("Company pricing defaults updated.");
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape" && document.getElementById("modalRoot").innerHTML) closeModal();
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s" && state.ui.currentView === "builder") {
    event.preventDefault();
    saveDraftQuote();
  }
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k" && state.ui.currentView === "quotes") {
    event.preventDefault();
    document.getElementById("quoteSearch")?.focus();
  }
});

document.getElementById("menuToggle").addEventListener("click", () => document.body.classList.toggle("sidebar-open"));
document.getElementById("mobileOverlay").addEventListener("click", () => document.body.classList.remove("sidebar-open"));
document.getElementById("notificationButton").addEventListener("click", showNotifications);

document.querySelectorAll(".nav-item").forEach(btn => btn.addEventListener("click", () => {
  if (btn.dataset.view !== "builder") setView(btn.dataset.view);
}));

window.addEventListener("beforeunload", event => {
  if (draftDirty) {
    event.preventDefault();
    event.returnValue = "";
  }
});

state.quotes.forEach(recalculateQuote);
saveState();
renderView(state.ui.currentView || "dashboard");
</script>
</body>
</html>
